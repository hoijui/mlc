[package]
name = "mlc"
version = "0.17.1"
authors = ["Armin Becher <becherarmin@gmail.com>"]
edition = "2024"
description = "The markup link checker (mlc) checks for broken links in markup files."
categories = ["command-line-utilities", "development-tools::testing", "text-processing"]
keywords = ["link-checker", "broken", "markup", "html", "markdown"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/becheran/mlc"

[badges]
maintenance = { status = "actively-developed" }
is-it-maintained-open-issues = { repository = "becheran/mlc" }
is-it-maintained-issue-resolution = { repository = "becheran/mlc" }

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
#wildcard_enum_match_arm = "warn"
#string_slice = "warn"
#indexing_slicing = "warn"
#clone_on_ref_ptr = "warn"
#try_err = "warn"
shadow_reuse = "warn"
#single_char_lifetime_names = "warn"
#empty_structs_with_brackets = "warn"
#else_if_without_else = "warn"
use_debug = "warn"
print_stdout = "warn"
print_stderr = "warn"
# NOTE allowed because:
#      If the same regex is going to be applied to multiple inputs,
#      the pre-computations done by Regex construction
#      can give significantly better performance
#      than any of the `str`-based methods.
trivial_regex = { level = "allow", priority = 1 }
default_trait_access = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
#fn_params_excessive_bools = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }

[dependencies]
async-std = "1.12"
async-walkdir = "2.1"
clap = { version = "4.0", features = ["cargo"] }
colored = "3.0"
const_format = "0.2"
futures = "0.3"
git-version = "0.3"
log = "0.4"
# mle = { path = "../mle" }
mle = "0.27"
pulldown-cmark = "0.13"
regex = "1.10"
reqwest = { version = "0.12", features = ["rustls-tls", "brotli", "gzip", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
simplelog = "0.12"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.9"
url = "2.5"
url-escape = "0.1"
wildmatch = "2.4"

[dev-dependencies]
criterion = "0.7"
ntest = "0.9"

[[bench]]
name = "benchmarks"
harness = false
