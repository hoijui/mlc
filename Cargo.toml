[package]
name = "mlc"
version = "0.17.1"
authors = ["Armin Becher <becherarmin@gmail.com>"]
edition = "2021"
description = "The markup link checker (mlc) checks for broken links in markup files."
categories = ["command-line-utilities", "development-tools::testing", "text-processing"]
keywords = ["link-checker", "broken", "markup", "html", "markdown"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/becheran/mlc"

[badges]
maintenance = { status = "actively-developed" }
is-it-maintained-open-issues = { repository = "becheran/mlc" }
is-it-maintained-issue-resolution = { repository = "becheran/mlc" }

[dependencies]
async-std = "1.12"
async-walkdir = "2.1"
clap = { version = "4.0", features = ["cargo"] }
colored = "3.0"
const_format = "0.2"
futures = "0.3"
git-version = "0.3"
log = "0.4"
# mle = { path = "../mle" }
mle = "0.27"
pulldown-cmark = "0.13"
regex = "1.10"
reqwest = { version = "0.12", features = ["rustls-tls", "brotli", "gzip", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
simplelog = "0.12"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.9"
url = "2.5"
url-escape = "0.1"
wildmatch = "2.4"

[dev-dependencies]
criterion = "0.7"
ntest = "0.9"

[[bench]]
name = "benchmarks"
harness = false
